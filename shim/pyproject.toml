[project]
name = "pbg-torch"
# The pre-rename dist name. This shim just depends on viva-torch so existing
# `pbg-torch` deps keep resolving. Import `viva_torch` (a `pbg_torch` import
# shim also ships in viva-torch). Keep the version in lockstep with viva-torch.
version = "0.1.0"
description = "Deprecated alias — renamed to 'viva-torch'. Depends on it so existing 'pbg-torch' deps keep resolving."
requires-python = ">=3.11"
dependencies = ["viva-torch>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbg_torch_shim"]
