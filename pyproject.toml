[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-torch"
version = "0.1.0"
description = "Neural-network surrogate Processes for process-bigraph — learn a drop-in approximation of any Process/Composite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=1.4.12",
    "bigraph-schema",
    "numpy",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-torch"
Issues = "https://github.com/vivarium-collective/viva-torch/issues"

[tool.setuptools.packages.find]
include = ["viva_torch*", "pbg_torch*"]  # viva_torch real; pbg_torch = back-compat import shim
